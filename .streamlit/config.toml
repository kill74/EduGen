# EduGen — ASCII-art / terminal aesthetic (Omarchy-inspired)
# Tipografia: JetBrains Mono (mono everywhere) + Geist (text fallback)
# Paleta: dark terminal ground, green/cyan accents, warm grays.

[theme]
base = "dark"
primaryColor = "#4ADE80"
backgroundColor = "#0f0f0f"
secondaryBackgroundColor = "#1a1a1a"
textColor = "#d4d4d4"
linkColor = "#4ADE80"
borderColor = "#2a2a2a"
codeTextColor = "#4ADE80"
codeBackgroundColor = "#1a1a1a"
font = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap"
headingFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
headingFontSizes = ["36px", "26px", "20px", "17px", "15px", "13px"]
headingFontWeights = [700, 600, 600, 500, 500, 500]
metricValueFontSize = "2.8rem"
metricValueFontWeight = 700
linkUnderline = false
baseRadius = "0px"
buttonRadius = "0px"
showWidgetBorder = false
showSidebarBorder = false
paddingTop = "1.5rem"
paddingBottom = "2rem"
greenColor = "#4ADE80"
redColor = "#F87171"
yellowColor = "#FBBF24"
orangeColor = "#FB923C"
blueColor = "#60A5FA"
violetColor = "#A78BFA"
grayColor = "#737373"
chartCategoricalColors = ["#4ADE80", "#60A5FA", "#A78BFA", "#FBBF24", "#F87171", "#2DD4BF", "#FB923C"]

# Sidebar: slightly lighter dark, green accent
[theme.sidebar]
backgroundColor = "#111111"
secondaryBackgroundColor = "#1a1a1a"
codeBackgroundColor = "#1a1a1a"
textColor = "#a3a3a3"
borderColor = "#2a2a2a"
primaryColor = "#4ADE80"
linkColor = "#4ADE80"
showWidgetBorder = false
paddingTop = "1rem"
paddingBottom = "1.5rem"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
