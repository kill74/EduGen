# EduGen — aparência única e limpa (sem toggle claro/escuro).

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F7F9"
textColor = "#1F2937"
borderColor = "#E5E7EB"
linkColor = "#2563EB"
codeBackgroundColor = "#F6F7F9"
codeTextColor = "#1F2937"
font = "sans-serif"
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = false
showSidebarBorder = false
paddingTop = "1.5rem"
paddingBottom = "1.5rem"

[theme.sidebar]
backgroundColor = "#F6F7F9"
borderColor = "#E5E7EB"
primaryColor = "#2563EB"
linkColor = "#2563EB"
showWidgetBorder = false

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
